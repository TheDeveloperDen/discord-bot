services:
  postgres:
    image: postgres:18-alpine
    container_name: devden_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d database" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  bot:
    image: discord-bot:latest
    build: .
    container_name: devden_bot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DDB_HOST: postgres
      DDB_PORT: "5432"
      DDB_DATABASE: database
      DDB_USERNAME: root
      DDB_PASSWORD: password
      DDB_DIALECT: postgres
      DDB_BOT_TOKEN: ${DDB_BOT_TOKEN}
      DDB_PASTE_BYPASS_TOKEN: ${DDB_PASTE_BYPASS_TOKEN:-}
    restart: unless-stopped

  activity:
    image: discord-bot:latest
    build: .
    container_name: devden_activity
    profiles: ["activity"]
    entrypoint: ["bun", "run", "activity:start"]
    environment:
      ACTIVITY_PORT: "3001"
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 30s
      timeout: 30s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
